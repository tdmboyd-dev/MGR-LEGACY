name: Postgres Integration

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/postgres-ci-trigger"

concurrency:
  group: postgres-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mgr_legacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mgr_legacy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LEGACY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mgr_legacy_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
      - run: npm run test:api-postgres
      - run: npm run test:upgrade-path
      - run: npm run test:backup-restore
